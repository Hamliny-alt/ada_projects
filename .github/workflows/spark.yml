name: ÆGIS SPARK Verification

on: [push, pull_request]

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Alire (Ada Package Manager)
        uses: alire-project/setup-alire@v3

      - name: Install Toolchain and Verify with GNATprove
        run: |
          # Konfigurera och hämta gnat/gnatprove automatiskt via Alire
          alr --non-interactive toolchain --select
          
          # Kör formell verifiering på projektet
          gnatprove -P aegis.gpr --mode=all --spark-debug
