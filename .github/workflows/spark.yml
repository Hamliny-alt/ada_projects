name: ÆGIS SPARK Verification

on: [push, pull_request]

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Alire (Ada Package Manager)
        uses: alire-project/setup-alire@v3

      - name: Run Formal Verification via Alire
        run: |
          # Ladda projektets beroenden (inklusive gnatprove) automatiskt
          alr --non-interactive اقتصادی
          alr with gnatprove || true
          
          # Kör formell verifiering
          gnatprove -P aegis.gpr --mode=all --spark-debug
