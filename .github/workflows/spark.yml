name: ÆGIS SPARK Verification

on: [push, pull_request]

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Alire (Ada Package Manager)
        uses: alire-project/setup-alire@v3

      - name: Run Formal Verification via Alire
        run: |
          # Konfigurera alire icke-interaktivt och uppdatera sessionen
          alr --non-interactive index --update
          alr --non-interactive toolchain --select
          
          # Kör formell verifiering
          gnatprove -P aegis.gpr --mode=all --spark-debug
